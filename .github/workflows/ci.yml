name: CI

on:
  pull_request:
  push:
    branches: [main]

# Somente leitura: o workflow não publica, não comenta e não altera o repositório.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build e e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      # E2E no Chromium do Playwright (headless), com a extensão de dist/ e o
      # mock do Ollama em 127.0.0.1:11434; depende do build acima.
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run test:e2e
